# Keeps the SHA-pinned actions (and dev dependencies) current: Dependabot
# bumps the SHA together with its `# vX.Y.Z` comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a few days before proposing a fresh release, so a compromised or
    # broken version has time to be caught and pulled.
    cooldown:
      default-days: 7
    # `@types/node` majors track Node.js majors, and the declarations stay on
    # the oldest Node.js the package supports (`engines.node: >=22`): typing
    # against a newer API surface would let an API missing from Node 22
    # compile here and only fail at runtime for the users the package
    # advertises. Move the types with the `engines` floor, not with the latest
    # release; minor and patch updates on 22.x still arrive.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
