name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 5 requires ^22.12.0 || ^24.0.0 || >=26.0.0
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Includes tsconfig.web.json: src must compile without @types/node.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes test/runtimes.test.ts, which runs the bundle inside
      # @edge-runtime/vm (Vercel Edge) and workerd via Miniflare
      # (Cloudflare Workers).
      - name: Test
        run: npm test

      # `tsdown` bundles the library and validates the packaged result with
      # publint (exports/main/files wiring) and attw (declaration resolution in
      # every TypeScript resolution mode).
      - name: Build
        run: npm run build
