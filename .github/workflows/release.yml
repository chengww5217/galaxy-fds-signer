name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm provenance: npm exchanges this OIDC token for a signed
  # attestation linking the tarball to this workflow run and commit.
  id-token: write

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Guards against publishing a version that disagrees with the release
      # tag: npm versions cannot be overwritten once published.
      - name: Verify tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$TAG"

      - run: npm ci

      # A package's first version cannot be published via OIDC: npm needs the
      # package to exist before a trusted publisher can be configured
      # (npm/cli#8544), so 0.1.0 was published manually. Skipping it here keeps
      # that one release idempotent. Because the tag encodes the version, the
      # check above means "already on the registry" can only be this version.
      - name: Check published version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "${name}@${version} is already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # `prepublishOnly` runs typecheck, lint, tests, build and
      # publint/attw, so nothing reaches the registry unverified.
      #
      # Authentication uses npm trusted publishing (OIDC), so no long-lived
      # NPM_TOKEN secret is stored. Configure it once on npmjs.com:
      #   package → Settings → Trusted Publisher → GitHub Actions
      #                         → repository `chengww5217/galaxy-fds-signer`
      #                         → workflow `release.yml`
      # With a public repository, npm enables provenance automatically.
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish
